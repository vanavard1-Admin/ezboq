<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; }
  .card {
    width: 1200px; height: 630px;
    background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    text-align: center;
  }
  .top-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #1a1a1a; }
  .logo { width: 160px; margin-bottom: 24px; }
  .headline {
    font-size: 42px; font-weight: 700; color: #1a1a1a;
    line-height: 1.3; margin-bottom: 16px;
  }
  .body-text {
    font-size: 20px; color: #666; line-height: 1.6; max-width: 700px;
    margin-bottom: 32px;
  }
  .cta {
    background: #1a1a1a; color: #fff;
    padding: 14px 40px; border-radius: 50px;
    font-size: 18px; font-weight: 600;
    letter-spacing: 0.5px;
  }
  .corner-dots {
    position: absolute; bottom: 20px; right: 20px;
    display: grid; grid-template-columns: repeat(5,1fr); gap: 6px;
  }
  .corner-dots span { width: 6px; height: 6px; background: #ddd; border-radius: 50%; }
  .url { position: absolute; bottom: 24px; left: 40px; font-size: 14px; color: #bbb; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="top-line"></div>
  <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
  <div class="headline">สร้างใบเสนอราคา<br>ได้ใน 5 นาที</div>
  <div class="body-text">ไม่ต้องพิมพ์ซ้ำ ไม่ต้องใช้ Excel อีกต่อไป<br>ครบทุกเอกสาร ตั้งแต่ BOQ ถึง Receipt</div>
  <div class="cta">เริ่มใช้ฟรี →</div>
  <div class="url">ezboq.com</div>
  <div class="corner-dots">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
</body>
</html>
