<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; }
  .card {
    width: 1080px; height: 1080px;
    background: #FAFAFA;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative;
  }
  .border-frame {
    position: absolute; top: 30px; left: 30px; right: 30px; bottom: 30px;
    border: 2px solid #1a1a1a; border-radius: 16px;
  }
  .logo { width: 200px; margin-bottom: 40px; }
  .headline {
    font-size: 52px; font-weight: 700; color: #1a1a1a;
    line-height: 1.3; margin-bottom: 20px;
  }
  .sub {
    font-size: 22px; color: #888; line-height: 1.5; max-width: 600px;
    margin-bottom: 40px;
  }
  .cta {
    background: #1a1a1a; color: #fff;
    padding: 16px 48px; border-radius: 50px;
    font-size: 20px; font-weight: 600;
  }
  .bottom-text {
    position: absolute; bottom: 50px;
    font-size: 16px; color: #ccc; letter-spacing: 2px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="border-frame"></div>
  <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
  <div class="headline">ใบเสนอราคา<br>ออนไลน์</div>
  <div class="sub">ง่ายแค่ปลายนิ้ว<br>สำหรับช่างและผู้รับเหมา</div>
  <div class="cta">เริ่มใช้ฟรี</div>
  <div class="bottom-text">EZBOQ.COM</div>
</div>
</body>
</html>
