<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; }
  .card {
    width: 1080px; height: 1080px;
    background: #1a1a1a; color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .content { position: relative; z-index: 1; }
  .logo { width: 180px; filter: invert(1); margin-bottom: 50px; }
  .num { font-size: 120px; font-weight: 700; line-height: 1; margin-bottom: 10px; }
  .unit { font-size: 28px; color: rgba(255,255,255,0.6); margin-bottom: 40px; }
  .desc { font-size: 24px; color: rgba(255,255,255,0.8); line-height: 1.5; max-width: 600px; }
  .bottom-accent {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: #fff;
  }
  .url { position: absolute; bottom: 30px; font-size: 16px; color: rgba(255,255,255,0.4); letter-spacing: 2px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="grid-bg"></div>
  <div class="content">
    <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
    <div class="num">5</div>
    <div class="unit">นาที</div>
    <div class="desc">สร้างใบเสนอราคาได้ครบ<br>ไม่ต้องพิมพ์ซ้ำอีกต่อไป</div>
  </div>
  <div class="bottom-accent"></div>
  <div class="url">EZBOQ.COM</div>
</div>
</body>
</html>
