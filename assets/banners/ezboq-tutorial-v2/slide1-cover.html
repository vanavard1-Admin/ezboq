<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:'Noto Sans Thai','Segoe UI',sans-serif; }
  .card {
    width:1080px; height:1080px; position:relative;
    background: url('/Users/l168/Documents/ใบเสนอราคา/assets/banners/ezboq-tutorial-v2/bg-cover.png') center/cover;
  }
  .overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.85) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:60px; text-align:center;
  }
  .logo { width:140px; margin-bottom:24px; filter:brightness(10); }
  .badge { background:rgba(255,255,255,0.2); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:8px 24px; border-radius:50px; font-size:15px; letter-spacing:2px; margin-bottom:20px; }
  .headline { font-size:52px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:16px; text-shadow:0 2px 8px rgba(0,0,0,0.3); }
  .sub { font-size:24px; color:rgba(255,255,255,0.85); margin-bottom:30px; }
  .cta { background:#fff; color:#1a1a1a; padding:14px 40px; border-radius:50px; font-size:18px; font-weight:600; margin-bottom:20px; }
  .swipe { font-size:15px; color:rgba(255,255,255,0.5); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<div class="card">
  <div class="overlay">
    <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
    <div class="badge">TUTORIAL</div>
    <div class="headline">วิธีใช้ EzBOQ<br>สร้างใบเสนอราคา</div>
    <div class="sub">ง่ายแค่ 4 ขั้นตอน 🐱</div>
    <div class="cta">เริ่มใช้ฟรี → ezboq.com</div>
    <div class="swipe">ปัดไปทางซ้าย →</div>
  </div>
</div>
</body></html>
