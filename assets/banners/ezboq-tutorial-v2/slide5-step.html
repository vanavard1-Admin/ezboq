<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;overflow:hidden;font-family:'Noto Sans Thai','Segoe UI',sans-serif}
  .card{width:1080px;height:1080px;position:relative;background:url('/Users/l168/Documents/ใบเสนอราคา/assets/banners/ezboq-tutorial-v2/bg-cover.png') center/cover}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.7) 50%,rgba(0,0,0,0.9) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:60px;color:#fff}
  .step-num{font-size:80px;font-weight:700;line-height:1;margin-bottom:8px;opacity:0.3;position:absolute;top:40px;right:60px}
  .step-badge{display:inline-block;background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);padding:6px 20px;border-radius:50px;font-size:14px;letter-spacing:1px;margin-bottom:16px;width:fit-content}
  .title{font-size:36px;font-weight:700;line-height:1.3;margin-bottom:24px}
  .points{display:flex;flex-direction:column;gap:16px;margin-bottom:30px}
  .point{font-size:22px;color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.08);padding:16px 20px;border-radius:12px;border-left:3px solid rgba(255,255,255,0.4)}
  .point b{color:#fff}
  .docs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
  .doc{font-size:20px;background:rgba(255,255,255,0.1);padding:16px;border-radius:10px;text-align:center}
  .cta{background:#fff;color:#1a1a1a;padding:14px 36px;border-radius:50px;font-size:18px;font-weight:600;text-align:center;width:fit-content;margin-top:10px}
  .logo{position:absolute;top:40px;left:60px;width:80px;filter:brightness(10)}
  .page-dots{position:absolute;bottom:24px;right:40px;display:flex;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3)}
  .dot:nth-child(5){background:#fff}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<div class="card">
  <div class="overlay">
    <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
    <div class="step-num">04</div>
    <div class="step-badge">STEP 04</div>
    <div class="title">Export PDF ส่งลูกค้าเลย!</div>
    <div class='points'><div class='point'>📄 ดาวน์โหลด PDF</div><div class='point'>💬 ส่งผ่าน LINE</div><div class='point'>📧 ส่งอีเมล</div></div><div class='cta'>เริ่มใช้ฟรี → ezboq.com</div>
  </div>
  <div class="page-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body></html>
