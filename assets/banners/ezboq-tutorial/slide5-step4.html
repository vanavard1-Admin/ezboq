<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:'Noto Sans Thai','Segoe UI',sans-serif; }
  .card { width:1080px; height:1080px; background:#1a1a1a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; }
  .grid-bg { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px); background-size:40px 40px; }
  .content { position:relative; z-index:1; }
  .logo { width:160px; filter:invert(1); margin-bottom:30px; }
  .step-num { font-size:60px; font-weight:700; margin-bottom:8px; }
  .headline { font-size:40px; font-weight:700; line-height:1.3; margin-bottom:24px; }
  .methods { display:flex; gap:20px; margin-bottom:40px; }
  .method { background:rgba(255,255,255,0.1); padding:20px 28px; border-radius:12px; text-align:center; }
  .method-icon { font-size:32px; margin-bottom:8px; }
  .method-name { font-size:18px; }
  .cta { background:#fff; color:#1a1a1a; padding:16px 48px; border-radius:50px; font-size:20px; font-weight:600; }
  .bottom-accent { position:absolute; bottom:0; left:0; right:0; height:4px; background:#fff; }
  .page-dots { position:absolute; bottom:20px; right:40px; display:flex; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.3); }
  .dot.active { background:#fff; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<div class="card">
  <div class="grid-bg"></div>
  <div class="content">
    <img src="/Users/l168/Documents/ใบเสนอราคา/apps/web/public/ezboq-logo.png" class="logo">
    <div class="step-num">04</div>
    <div class="headline">Export PDF<br>ส่งให้ลูกค้าเลย!</div>
    <div class="methods">
      <div class="method"><div class="method-icon">📄</div><div class="method-name">ดาวน์โหลด PDF</div></div>
      <div class="method"><div class="method-icon">💬</div><div class="method-name">ส่งผ่าน LINE</div></div>
      <div class="method"><div class="method-icon">📧</div><div class="method-name">ส่งอีเมล</div></div>
    </div>
    <div class="cta">เริ่มใช้ฟรี → ezboq.com</div>
  </div>
  <div class="bottom-accent"></div>
  <div class="page-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
</div>
</body></html>
