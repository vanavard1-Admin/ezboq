<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:'Noto Sans Thai','Segoe UI',sans-serif; }
  .card { width:1080px; height:1080px; background:#fff; display:flex; flex-direction:column; position:relative; }
  .top { background:#1a1a1a; color:#fff; padding:40px 60px; }
  .step-num { font-size:60px; font-weight:700; line-height:1; }
  .step-title { font-size:28px; margin-top:8px; color:rgba(255,255,255,0.8); }
  .middle { flex:1; display:flex; align-items:center; justify-content:center; padding:30px; }
  .screenshot { max-width:960px; max-height:520px; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
  .bottom { padding:30px 60px 40px; }
  .desc { font-size:22px; color:#444; line-height:1.6; }
  .highlight { color:#1a1a1a; font-weight:700; }
  .page-dots { position:absolute; bottom:20px; right:40px; display:flex; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ddd; }
  .dot.active { background:#1a1a1a; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<div class="card">
  <div class="top">
    <div class="step-num">01</div>
    <div class="step-title">สมัครสมาชิก / เข้าสู่ระบบ</div>
  </div>
  <div class="middle">
    <img src="/Users/l168/Documents/ใบเสนอราคา/assets/banners/ezboq-tutorial/step1-landing.png" class="screenshot">
  </div>
  <div class="bottom">
    <div class="desc">เข้า <span class="highlight">ezboq.com</span> → กดสมัครสมาชิกด้วยอีเมล หรือ <span class="highlight">Login ด้วย Google</span> ได้เลย ฟรี!</div>
  </div>
  <div class="page-dots"><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body></html>
